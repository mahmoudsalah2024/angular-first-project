<div class="mb-4 h-100">
    <div class="pt-4">
            <div class="text-center pt-4" style="color: rgb(44, 62, 80);">
                <h2 class="text-uppercase mb-3 fs-1 fw-bolder">portfolio component</h2>
                <div class="d-flex align-items-center justify-content-center mb-3">
                    <div class="line me-3" style="background-color: rgb(44, 62, 80);"></div><i
                        class="fa-solid fa-star"></i>
                    <div class="line ms-3" style="background-color: rgb(44, 62, 80);"></div>
                </div>
            </div>
        <div class="container">
            <div class="row g-5">
                <div *ngFor="let project of projects" class="col-lg-4 col-md-6">
                    <div class="rounded-3 overflow-hidden position-relative">
                        <img
                            alt="" class="w-100 rounded-3"
                            [src]="project.image" 
                            >
                        <div class="layer__ position-absolute start-0 w-100 top-0 h-100 d-flex justify-content-center align-items-center" (click)="openImage(project.image)" >
                            <i class="text-white fa-solid fa-plus fa-6x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
      <div class="overlay" *ngIf="selectedImage" (click)="closeImage()">
        <div>
            <img [src]="selectedImage" class="preview" />
        </div>
      </div>
</div>
